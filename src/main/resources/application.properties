spring.application.name=be-management-pengiriman
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pengiriman_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:pengiriman_user}
spring.datasource.password=${DB_PASSWORD:pengiriman_pass}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

mysawit.services.user.base-url=${USER_SERVICE_BASE_URL:http://localhost:8080}
mysawit.services.user.auth-token=${USER_SERVICE_AUTH_TOKEN:}
mysawit.services.hasil-panen.base-url=${HARVEST_SERVICE_BASE_URL:http://localhost:8082}
mysawit.services.pembayaran.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}
mysawit.services.kebun.base-url=${KEBUN_SERVICE_BASE_URL:http://localhost:8081}
mysawit.services.kebun.auth-token=${KEBUN_SERVICE_AUTH_TOKEN:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

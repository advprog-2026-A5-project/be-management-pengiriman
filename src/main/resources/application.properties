spring.application.name=be-management-pengiriman

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=pengiriman_user
spring.datasource.password=pengiriman_pass

spring.jpa.hibernate.ddl-auto=create-drop

user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8080}
user.service.auth-token=${USER_SERVICE_AUTH_TOKEN:}
harvest.service.base-url=${HARVEST_SERVICE_BASE_URL:http://localhost:8082}
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}
kebun.service.base-url=${KEBUN_SERVICE_BASE_URL:http://localhost:8081}
kebun.service.auth-token=${KEBUN_SERVICE_AUTH_TOKEN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

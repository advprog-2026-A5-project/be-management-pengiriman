name: CI Pipeline

on:
  push:
    branches:
      - master
      - staging
      - 'feat/**'
      - 'refactor/**'
      - 'test/**'
  pull_request:
    branches:
      - master
      - staging

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar --no-daemon

      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: SonarCloud analysis with coverage
        run: ./gradlew clean test jacocoTestReport sonar --no-daemon
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  deploy-aws:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sonarcloud

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Spring Boot JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: build/libs

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Create deployment env file
        env:
          PENGIRIMAN_DB_URL: ${{ secrets.PENGIRIMAN_DB_URL }}
          PENGIRIMAN_DB_USERNAME: ${{ secrets.PENGIRIMAN_DB_USERNAME }}
          PENGIRIMAN_DB_PASSWORD: ${{ secrets.PENGIRIMAN_DB_PASSWORD }}
          PENGIRIMAN_CORS_ALLOWED_ORIGINS: ${{ secrets.PENGIRIMAN_CORS_ALLOWED_ORIGINS }}
          USER_SERVICE_BASE_URL: ${{ secrets.USER_SERVICE_BASE_URL }}
          USER_SERVICE_AUTH_TOKEN: ${{ secrets.USER_SERVICE_AUTH_TOKEN }}
          HARVEST_SERVICE_BASE_URL: ${{ secrets.HARVEST_SERVICE_BASE_URL }}
          PAYMENT_SERVICE_BASE_URL: ${{ secrets.PAYMENT_SERVICE_BASE_URL }}
          KEBUN_SERVICE_BASE_URL: ${{ secrets.KEBUN_SERVICE_BASE_URL }}
          KEBUN_SERVICE_AUTH_TOKEN: ${{ secrets.KEBUN_SERVICE_AUTH_TOKEN }}
        run: |
          for required in PENGIRIMAN_DB_URL PENGIRIMAN_DB_USERNAME PENGIRIMAN_DB_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing GitHub Secret: ${required}"
              exit 1
            fi
          done

          python3 - <<'PY'
          import os
          import shlex

          values = {
              "SERVER_PORT": "8083",
              "DB_URL": os.environ["PENGIRIMAN_DB_URL"],
              "DB_USERNAME": os.environ["PENGIRIMAN_DB_USERNAME"],
              "DB_PASSWORD": os.environ["PENGIRIMAN_DB_PASSWORD"],
              "CORS_ALLOWED_ORIGINS": os.environ.get("PENGIRIMAN_CORS_ALLOWED_ORIGINS", ""),
              "USER_SERVICE_BASE_URL": os.environ.get("USER_SERVICE_BASE_URL", ""),
              "USER_SERVICE_AUTH_TOKEN": os.environ.get("USER_SERVICE_AUTH_TOKEN", ""),
              "HARVEST_SERVICE_BASE_URL": os.environ.get("HARVEST_SERVICE_BASE_URL", ""),
              "PAYMENT_SERVICE_BASE_URL": os.environ.get("PAYMENT_SERVICE_BASE_URL", ""),
              "KEBUN_SERVICE_BASE_URL": os.environ.get("KEBUN_SERVICE_BASE_URL", ""),
              "KEBUN_SERVICE_AUTH_TOKEN": os.environ.get("KEBUN_SERVICE_AUTH_TOKEN", ""),
          }

          with open("deployment.env", "w", encoding="utf-8") as env_file:
              for key, value in values.items():
                  if value:
                      env_file.write(f"export {key}={shlex.quote(value)}\n")
          PY

      - name: Prepare app directory on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /opt/be-management-pengiriman"

      - name: Copy JAR to EC2
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem "$JAR_FILE" ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/be-management-pengiriman/app.jar

      - name: Copy env file to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem deployment.env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/be-management-pengiriman/.env

      - name: Restart Spring Boot app
        run: |
          -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            chmod 600 /opt/be-management-pengiriman/.env
            sudo systemctl daemon-reload
            sudo systemctl restart be-management-pengiriman
            sleep 20
            sudo systemctl status be-management-pengiriman --no-pager
            curl -f http://localhost:8083/actuator/health
          EOF
